\* Mutation noT2 under malicious maker: hostage is a LIVENESS failure, not theft.
\* HonestTakerSafe (never lose both) still HOLDS; only NoHostage (liveness) fails.
SPECIFICATION SpecSafety
CONSTANTS
    MaxTime = 22
    T0 = 4
    T1 = 7
    T2 = 13
    W  = 4
    D  = 1
    F  = 1
    KZ = 1
    MarginC = 2
    MarginR = 1
    MaxReorg = 1
    ADV = "maker"
    MUT = "noT2"
    AssumeMakerOnline = FALSE
    MakerOnlineFrom = 0
    AssumeTakerOnline = TRUE
CONSTRAINT Horizon
INVARIANTS
    TypeOK
    NoDoubleExit
    HonestTakerSafe
