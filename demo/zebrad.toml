# Zebra regtest config for the hosted demo: the harness's NU6.3 ("Ironwood") chain, with RPC on
# localhost only and the state in a temporary directory.

[network]
network = "Regtest"
listen_addr = "127.0.0.1:18344"
initial_testnet_peers = []

[network.testnet_parameters.activation_heights]
Canopy = 1
NU5 = 1
NU6 = 1
"NU6.1" = 1
"NU6.2" = 1
"NU6.3" = 1

[mining]
miner_address = "t27eWDgjFYJGVXmzrXeVjnb5J3uXDM9xH9v"

[mempool]
debug_enable_at_height = 0

[rpc]
listen_addr = "127.0.0.1:18232"
enable_cookie_auth = false

[state]
ephemeral = true
cache_dir = "/tmp/zebra"

[tracing]
use_color = false
