<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloakroom</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .zec { fill:var(--zec); }
  .tint { fill:var(--zec-soft); }
  .deep { fill:var(--ink); }
  .ground { fill:var(--paper); }
  .ok { fill:var(--final); }
  .edge { stroke:var(--line); stroke-width:var(--stroke); }
  .card { rx:var(--radius-md); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:80px; line-height:.92; font-weight:800; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      zec 200x232 bled off the top (the brand's one action colour, the big slab) · ink 184x112 (the outline and text colour) · zec-soft 184x96 (held funds) · final 64x24 pill once (it only means settled), about 40% of 960x288
  arrangement one tall yellow slab with two stacked satellites, all outlined in line at stroke, the slab carrying shadow-hard's 4px ink offset as the swap card does
  pattern     pills, from "actions and chips are pills": radius-pill bars at a space-6 pitch, yellow pills cut into the ink block, ink pills on the tint
  scales      sides in space-2 multiples; gutters space-4; pitch space-6; corners radius-md; pills rx half their 12px height
-->
<rect class="deep card" x="28" y="-4" width="200" height="232" rx="10"/>
<rect class="zec edge card" x="24" y="-8" width="200" height="232" rx="10"/>
<rect class="deep card" x="248" y="32" width="184" height="112" rx="10"/>
<rect class="tint edge card" x="248" y="160" width="184" height="96" rx="10"/>
<rect class="zec" x="264" y="56" width="56" height="12" rx="6"/>
<rect class="zec" x="328" y="56" width="32" height="12" rx="6"/>
<rect class="zec" x="264" y="80" width="32" height="12" rx="6"/>
<rect class="zec" x="304" y="80" width="88" height="12" rx="6"/>
<rect class="zec" x="264" y="104" width="72" height="12" rx="6"/>
<rect class="zec" x="344" y="104" width="24" height="12" rx="6"/>
<rect class="deep" x="264" y="184" width="40" height="12" rx="6"/>
<rect class="deep" x="312" y="184" width="64" height="12" rx="6"/>
<rect class="deep" x="264" y="208" width="88" height="12" rx="6"/>
<rect class="deep" x="360" y="208" width="24" height="12" rx="6"/>
<rect class="ok edge" x="24" y="248" width="64" height="24" rx="12"/>
<rect class="ground edge" x="96" y="248" width="40" height="24" rx="12"/>
</svg>
</div>
<div class="words">
<h1 class="name">Cloakroom</h1>
<p class="tag">Private ZEC to USDC swaps, settled without a custodian.</p>
</div>
</div>
</body>
</html>
