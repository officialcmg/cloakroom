[package]
name = "e2e-regtest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
blake2b_simd = "1"
ff = "0.14"
group = "0.14"
hex = "0.4.3"
incrementalmerkletree = "0.9"
orchard = "0.16.0"
pasta_curves = "0.6.1"
pczt = { version = "=0.10.0-pre.1", features = ["orchard", "io-finalizer", "prover", "signer", "tx-extractor", "zcp-builder"] }
rand = "0.10"
rand_core = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"
shardtree = "0.8"
zcash_address = "=0.14.0-pre.1"
zcash_note_encryption = "0.5.1"
zcash_primitives = "=0.31.0-pre.1"
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }

[profile.dev]
opt-level = 3
