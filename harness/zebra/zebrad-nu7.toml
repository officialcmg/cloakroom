# Zebra regtest config for the Cloakroom joint-key e2e demo.
# All upgrades through NU6.3 ("Ironwood") active from height 1; NU7 activated at height 2.

[network]
network = "Regtest"
listen_addr = "127.0.0.1:18344"
initial_testnet_peers = []

[network.testnet_parameters.activation_heights]
Canopy = 1
NU5 = 1
NU6 = 1
"NU6.1" = 1
"NU6.2" = 1
"NU6.3" = 1
NU7 = 2

[mining]
# Default payout for `generate`. The funding block uses `generatetoaddress <joint UA>`.
miner_address = "t27eWDgjFYJGVXmzrXeVjnb5J3uXDM9xH9v"

[mempool]
debug_enable_at_height = 0

[rpc]
listen_addr = "0.0.0.0:18232"
enable_cookie_auth = false

[state]
ephemeral = true
cache_dir = "/home/zebra/.cache/zebra"

[tracing]
use_color = false
